name: Build, Auto-Rename & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Auto-Detect Existing Package ID
        run: |
          echo "🔍 Mendeteksi package ID yang ada di proyek secara otomatis..."
          
          DETECTED_PACKAGE=""
          
          # Cek dari build.gradle.kts atau build.gradle
          if [ -f "app/build.gradle.kts" ]; then
            DETECTED_PACKAGE=$(grep -m 1 'applicationId' app/build.gradle.kts | cut -d'"' -f2)
            if [ -z "$DETECTED_PACKAGE" ]; then
              DETECTED_PACKAGE=$(grep -m 1 'namespace' app/build.gradle.kts | cut -d'"' -f2)
            fi
          elif [ -f "app/build.gradle" ]; then
            DETECTED_PACKAGE=$(grep -m 1 'applicationId' app/build.gradle | cut -d'"' -f2)
            if [ -z "$DETECTED_PACKAGE" ]; then
              DETECTED_PACKAGE=$(grep -m 1 'namespace' app/build.gradle | cut -d"'" -f2)
            fi
          fi
          
          echo "✅ Package ID / Namespace yang terdeteksi: $DETECTED_PACKAGE"
          echo "DETECTED_PACKAGE=$DETECTED_PACKAGE" >> $GITHUB_ENV

      - name: Auto Increment Version Code
        run: |
          echo "📈 Menaikkan versi APK secara otomatis..."
          BUILD_FILE=""
          if [ -f "app/build.gradle.kts" ]; then
            BUILD_FILE="app/build.gradle.kts"
          elif [ -f "app/build.gradle" ]; then
            BUILD_FILE="app/build.gradle"
          fi

          if [ -n "$BUILD_FILE" ]; then
            CURRENT_CODE=$(grep -m 1 'versionCode' "$BUILD_FILE" | grep -o '[0-9]*')
            if [ -n "$CURRENT_CODE" ]; then
              NEW_CODE=$((CURRENT_CODE + 1))
              sed -i "s/versionCode [0-9]*/versionCode $NEW_CODE/g" "$BUILD_FILE"
              sed -i "s/versionCode = [0-9]*/versionCode = $NEW_CODE/g" "$BUILD_FILE"
              echo "✅ VersionCode dinaikkan menjadi: $NEW_CODE"
            fi
          fi

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "⚙️ Membuat gradlew wrapper secara otomatis..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Xmx2048m -Dfile.encoding=UTF-8"
        run: ./gradlew assembleRelease

      - name: Prepare Renamed APK
        id: prep_apk
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          VERSION_NAME=$(grep -m 1 'versionName' app/build.gradle* | cut -d'"' -f2 || echo "1.0")
          
          NEW_APK_NAME="${REPO_NAME}-v${VERSION_NAME}-release.apk"
          mkdir -p build_output

          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "build_output/$NEW_APK_NAME"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "build_output/$NEW_APK_NAME"
          else
            echo "⚠️ Release APK tidak ditemukan, mencoba mengambil Debug APK..."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "build_output/$NEW_APK_NAME"
          fi
          
          echo "apk_path=build_output/$NEW_APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$NEW_APK_NAME" >> $GITHUB_OUTPUT
          echo "✅ APK berhasil disiapkan dengan nama: $NEW_APK_NAME"

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "Release v1.${{ github.run_number }} (Auto Build)"
          body: |
            🚀 **Automated Build Release**
            - File APK: `${{ steps.prep_apk.outputs.apk_name }}`
            - Package ID / Namespace: `${{ env.DETECTED_PACKAGE }}`
            - Status: Berhasil dirakit dan dideteksi otomatis oleh GitHub Actions.
          files: ${{ steps.prep_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
